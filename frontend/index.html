<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F4E79" />
    <link rel="icon" href="/icono.svg" />
    <script>
      // Apariencia antes de pintar (sin parpadeo). Claro si no se eligió otra cosa.
      (function () {
        var t = 'claro'
        try { t = localStorage.getItem('tikray-tema') || 'claro' } catch (e) {}
        if (t !== 'oscuro' && t !== 'auto') t = 'claro'
        document.documentElement.setAttribute('data-tema', t)
        var oscuro = t === 'oscuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        if (oscuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0F17')
      })()
    </script>
    <title>Colegio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
