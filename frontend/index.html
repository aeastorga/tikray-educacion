<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F4E79" />
    <link rel="icon" href="/icono.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iPhone: la app instalada se abre como app, con su nombre; la barra de estado queda aparte (sin tapar contenido). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Colegio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apariencia antes de pintar (sin parpadeo). Automático (lo que diga el equipo) si no se eligió otra cosa.
      (function () {
        var t = 'auto'
        try { t = localStorage.getItem('tikray-tema') || 'auto' } catch (e) {}
        if (t !== 'claro' && t !== 'oscuro') t = 'auto'
        document.documentElement.setAttribute('data-tema', t)
        var oscuro = t === 'oscuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        if (oscuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0F17')
      })()
    </script>
    <title>Colegio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
